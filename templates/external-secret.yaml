{{/*
Faz parte do release deste chart (template local, não do platform-chart) --
sobe junto no mesmo sync do ArgoCD. Extrai TODAS as chaves do JSON
guardado no OCI Vault como campos individuais do Secret do Kubernetes.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.kubernetesSecretName }}
spec:
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecret.kubernetesSecretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.vaultSecretName | quote }}
